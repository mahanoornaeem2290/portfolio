<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Nexus Store</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader-logo">NEXUS STORE</div>
    <div class="loader-bar"></div>
  </div>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-inner container-fluid px-md-5">
      <a href="index.html" class="nav-logo">
        <i class="fa-solid fa-cube me-2"></i>NEXUS STORE
      </a>

      <!-- Search Bar -->
      <div class="nav-search d-none d-lg-block">
        <span class="nav-search-icon"><i class="fas fa-search"></i></span>
        <input type="text" id="nav-search-input" placeholder="Search futuristic products...">
      </div>

      <!-- Links -->
      <ul class="nav-links d-none d-lg-flex mb-0 ps-0">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="shop.html" class="nav-link">Shop</a></li>
        <li><a href="cart.html" class="nav-link">Cart</a></li>
        <li><a href="profile.html" class="nav-link">Profile</a></li>
      </ul>

      <!-- Actions -->
      <div class="nav-actions">
        <!-- Theme Toggle -->
        <button id="theme-toggle" class="nav-btn" title="Toggle Theme">
          <i class="fas fa-sun"></i>
        </button>

        <!-- Cart Nav Button -->
        <a href="cart.html" class="nav-btn cart-nav-btn" title="View Cart">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge">0</span>
        </a>

        <!-- Sign In Button -->
        <a href="login.html" class="nav-btn-primary d-none d-sm-inline-block">
          Sign In
        </a>

        <!-- Hamburger for Mobile -->
        <button class="hamburger d-lg-none" aria-label="Toggle Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Mobile Navigation Drawer -->
  <div class="mobile-nav">
    <ul class="ps-0 mb-4">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="shop.html" class="nav-link">Shop</a></li>
      <li><a href="cart.html" class="nav-link">Cart</a></li>
      <li><a href="profile.html" class="nav-link">Profile</a></li>
    </ul>
    <a href="login.html" class="btn btn-primary w-100 justify-content-center">Sign In</a>
  </div>

  <!-- Auth Page (Sign Up) -->
  <section class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="index.html" class="nav-logo" style="font-size: 2rem;">
          <i class="fa-solid fa-cube me-2"></i>NEXUS
        </a>
      </div>
      <h1 class="auth-title">Join Nexus</h1>
      <p class="auth-sub">Create an account and unlock exclusive discounts, early drops, and more.</p>

      <form class="auth-form" id="signup-form">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" placeholder="Sarah Miller" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" placeholder="sarah@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="Create a strong password" required minlength="8">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-input" placeholder="Confirm your password" required>
        </div>

        <div class="d-flex align-items-center gap-2" style="font-size:0.85rem; color:var(--text-2);">
          <input type="checkbox" id="terms-check" style="accent-color:var(--primary);width:16px;height:16px;" required>
          <label for="terms-check">I agree to the <a href="#" style="color:var(--primary);font-weight:500;">Terms of Service</a> and <a href="#" style="color:var(--primary);font-weight:500;">Privacy Policy</a>.</label>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          <i class="fas fa-user-plus me-1"></i> Create Account
        </button>

        <div class="auth-or">or continue with</div>

        <div class="social-auth">
          <button type="button" class="social-auth-btn" onclick="showToast('Google signup coming soon!')">
            <i class="fab fa-google" style="color:#EA4335;"></i> Google
          </button>
          <button type="button" class="social-auth-btn" onclick="showToast('Apple signup coming soon!')">
            <i class="fab fa-apple" style="font-size:1.2rem;"></i> Apple
          </button>
        </div>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </section>

  <!-- Back to Top Button -->
  <button id="back-to-top" title="Go to top"><i class="fas fa-chevron-up"></i></button>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Main JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
